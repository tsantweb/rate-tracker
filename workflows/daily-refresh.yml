name: Daily rate refresh

on:
  schedule:
    # 13:00 UTC = 8:00 AM Eastern (adjust for daylight saving as needed)
    - cron: "0 13 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the refresh endpoint
        run: |
          curl -sS -X POST https://rate-tracker-1.onrender.com/api/refresh \
            --max-time 90 \
            --retry 2 \
            --retry-delay 20
