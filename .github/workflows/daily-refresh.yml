name: Daily rate refresh

on:
  schedule:
    # 13:00 UTC = 9:00 AM ET, catches SOFR (posts early)
    - cron: "0 13 * * *"
    # 22:00 UTC = 6:00 PM ET, catches Treasury/Prime/Fed Funds,
    # which typically post later in the afternoon or evening
    - cron: "0 22 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the refresh endpoint
        run: |
          curl -sS -X POST https://rate-tracker-1.onrender.com/api/refresh \
            --max-time 90 \
            --retry 2 \
            --retry-delay 20
